<body>
    <header class="research-header">
        <nav class="research-nav wrap" aria-label="Main navigation">
            <a class="wordmark" href="./index.html">← Back to portfolio</a>
        </nav>
    </header>

    <main class="pdf-page wrap">
        <div class="pdf-reader" aria-label="QMCO research PDF viewer">
            <div class="pdf-toolbar">
                <button id="prev-page" class="pdf-nav-button" type="button" aria-label="Previous page">← Prev</button>
                <span id="page-info" aria-live="polite">Loading PDF…</span>
                <button id="next-page" class="pdf-nav-button" type="button" aria-label="Next page">Next →</button>
            </div>
            <div class="pdf-canvas-wrap">
                <canvas id="pdf-canvas" aria-label="Current PDF page"></canvas>
            </div>
        </div>
    </main>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script>
        const pdfUrl = './assets/qmco-research.pdf';
        const canvas = document.getElementById('pdf-canvas');
        const ctx = canvas.getContext('2d');
        const prevButton = document.getElementById('prev-page');
        const nextButton = document.getElementById('next-page');
        const pageInfo = document.getElementById('page-info');

        let pdfDoc = null;
        let currentPage = 1;

        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

        function updateNavState() {
            if (!pdfDoc) return;
            prevButton.disabled = currentPage <= 1;
            nextButton.disabled = currentPage >= pdfDoc.numPages;
            pageInfo.textContent = `Page ${currentPage} / ${pdfDoc.numPages}`;
        }

        async function renderPage(pageNum) {
            if (!pdfDoc) return;

            const page = await pdfDoc.getPage(pageNum);
            const containerWidth = canvas.parentElement.clientWidth - 24;
            const unscaledViewport = page.getViewport({ scale: 1 });
            const scale = Math.min(1.5, containerWidth / unscaledViewport.width);
            const viewport = page.getViewport({ scale });

            canvas.width = Math.max(1, Math.floor(viewport.width));
            canvas.height = Math.max(1, Math.floor(viewport.height));
            canvas.style.width = `${canvas.width}px`;
            canvas.style.height = `${canvas.height}px`;

            await page.render({
                canvasContext: ctx,
                viewport
            }).promise;

            updateNavState();
        }

        async function loadPdf() {
            try {
                const loadingTask = pdfjsLib.getDocument(pdfUrl);
                pdfDoc = await loadingTask.promise;
                currentPage = 1;
                await renderPage(currentPage);
            } catch (error) {
                pageInfo.textContent = 'Unable to load PDF';
                const wrapper = document.querySelector('.pdf-canvas-wrap');
                wrapper.innerHTML = '<p class="pdf-error">The PDF could not be loaded. Please open it directly <a href="./assets/qmco-research.pdf">here</a>.</p>';
                console.error('Failed to load PDF:', error);
            }
        }

        prevButton.addEventListener('click', async () => {
            if (currentPage > 1) {
                currentPage -= 1;
                await renderPage(currentPage);
            }
        });

        nextButton.addEventListener('click', async () => {
            if (pdfDoc && currentPage < pdfDoc.numPages) {
                currentPage += 1;
                await renderPage(currentPage);
            }
        });

        window.addEventListener('resize', () => {
            if (pdfDoc) {
                renderPage(currentPage);
            }
        });

        loadPdf();
    </script>
</body>
